# Checks run on every pull request, Dependabot's included, before anything reaches master.
name: Checks

on:
  pull_request:

permissions:
  contents: read

# A newer push to the pull request makes the checks of the previous one pointless.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Code quality: formatting, lint rules, Prisma client generation and TypeScript compilation.
  code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Installs the pnpm version named by "packageManager" in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build

  # The production image is stripped by hand (files deleted by name, trimmed language data): a dependency
  # update can compile and still break it. Both images are built and exercised, without publishing them.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build the images
        run: |
          docker build --tag tsuyomi .
          docker build --tag tsuyomi-migrate --target migrate .

      - name: Apply the migrations to an empty database
        run: |
          mkdir data && sudo chown 1000:1000 data
          docker run --rm --network none --volume "$PWD/data:/app/data" tsuyomi-migrate

      # Runs .github/scripts/check-image.mjs inside the image of the bot, with the restrictions of
      # compose.yaml and no network.
      - name: Exercise the image of the bot
        run: >
          docker run --rm --network none --read-only --cap-drop ALL
          --volume "$PWD/data:/app/data"
          --volume "$PWD/.github/scripts/check-image.mjs:/tmp/check-image.mjs:ro"
          tsuyomi /usr/bin/node /tmp/check-image.mjs
