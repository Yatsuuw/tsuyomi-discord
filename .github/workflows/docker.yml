# Builds the two images of the Dockerfile and publishes them to the GitHub Container Registry:
#   ghcr.io/<owner>/<repository>          the bot (default target)
#   ghcr.io/<owner>/<repository>-migrate  the one-off database migration job
# compose.yaml pulls both from there: the production server never builds anything.
name: Docker images

on:
  push:
    branches: [master]
    tags: ["v*"]
  # Allows a rebuild from the Actions tab without pushing a commit.
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# A newer push makes the build of an older one pointless.
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: runtime
            suffix: ""
          - target: migrate
            suffix: -migrate
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # The token GitHub gives the workflow is enough to push packages of this repository.
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags: "latest" for the default branch, the version for a "v1.2.3" tag, and the commit in all cases
      # so that a given build can be pinned or rolled back to. The image name is lower-cased here.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}${{ matrix.suffix }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,format=short

      - uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
